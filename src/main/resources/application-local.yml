# 로컬 개발/데모용 프로필: DB·API키 없이 H2 인메모리 + MOCK 모드로 기동.
# 실행:  SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
# 그다음 브라우저에서 http://localhost:8080/swagger-ui.html
spring:
  datasource:
    url: jdbc:h2:mem:ilgo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true   # http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:ilgo)

app:
  mock-mode: true     # Claude 호출 없이 mock JSON 반환

anthropic:
  api-key: dummy      # mock 모드라 실제로 사용되지 않음
