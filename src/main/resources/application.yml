server:
  port: ${PORT:8080}

spring:
  application:
    name: ilgo
  profiles:
    # 아무 프로필도 지정하지 않으면 supabase 를 기본 활성화 → application-supabase.yml 로드(로컬 개발).
    # 명시적으로 프로필을 주면(예: local, prod) 이 값은 무시됨.
    default: supabase
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 6MB      # 5MB 이미지 + 여유
      max-request-size: 8MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    # Supabase Pooler(6543, pgbouncer transaction mode) 사용 시:
    #   URL 뒤에 ?prepareThreshold=0 을 붙여 prepared statement 이슈를 피한다.
    #   예) jdbc:postgresql://<host>:6543/postgres?prepareThreshold=0
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

jwt:
  # JWT_SECRET 환경변수가 있으면 그걸 쓰고, 없으면 아래 기본값 사용(배포/로컬 모두 동작).
  # ⚠️ 공개 저장소면 토큰 위조 위험 → 운영에서는 반드시 JWT_SECRET 로 덮어쓸 것.
  secret: ${JWT_SECRET:b7Yk2pQf9mZx4Rj8Ns3Vw6Lc1Hd5Tg0Ae7Uy2Ki9Oq4Bp8Xr3Mv6Sn1Zt5Wl0JfE2}
  # access 는 짧게(기본 30분), refresh 는 길게(기본 14일). refresh 는 DB 저장 + 회전.
  access-expires-in: ${JWT_ACCESS_EXPIRES_IN:1800}      # 초 단위, 기본 30분
  refresh-expires-in: ${JWT_REFRESH_EXPIRES_IN:1209600} # 초 단위, 기본 14일

ai:
  # OpenAI 호환 게이트웨이(Chat Completions 형식).
  # 실제 키는 여기(깃 추적 파일)에 넣지 말 것.
  #  - 로컬: application-supabase.yml(gitignore)에 ai.api-key 로 넣기
  #  - 배포(Railway): 환경변수 AI_API_KEY 설정
  base-url: ${AI_BASE_URL:https://factchat-cloud.mindlogic.ai/v1/gateway/chat/completions}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gemini-3-flash-preview}
  max-tokens: ${AI_MAX_TOKENS:4096}   # 실제 문서는 OCR 원문+풀이가 길어 1200 이면 잘려서 422 발생
  temperature: 0.2
  timeout-seconds: 30

app:
  rate-limit-per-min: ${RATE_LIMIT_PER_MIN:20}
  mock-mode: ${MOCK_MODE:false}
  mock-save: ${MOCK_SAVE:false}   # MOCK_MODE 에서 결과를 DB 에 저장할지 (기본: 저장 없이 즉시 반환)
  max-image-bytes: 5242880        # 5MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO