# 운영 설정. 비밀값은 전부 환경변수로 받는다 (Railway Variables / 로컬 .env).
spring:
  application:
    name: ilgo
  jackson:
    # API 명세가 snake_case (access_token, summary_one_line). 프론트도 이 형태로 파싱한다.
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  expires-in: ${JWT_EXPIRES_IN:604800}

ai:
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gemini-3-flash-preview}
  base-url: ${AI_BASE_URL:https://factchat-cloud.mindlogic.ai/v1/gateway/chat/completions}
  timeout-seconds: 30

app:
  # 키가 없으면 mock 응답으로 동작한다 (AI_API_KEY 비어 있을 때 true 권장)
  mock-mode: ${APP_MOCK_MODE:false}
  # mock 결과를 DB에 저장해 목록·상세가 실제 데이터로 이어지게 한다
  mock-save: ${APP_MOCK_SAVE:true}
  rate-limit-per-min: 20
  # 웹 프론트 주소. 콤마로 여러 개 (예: https://jihwan0210.github.io,http://localhost:3000)
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # 시연용 계정. 기동 시 없으면 만든다 (로그인 화면의 자동 입력 버튼과 같은 값)
  demo:
    enabled: ${APP_DEMO_ENABLED:true}
    email: ${APP_DEMO_EMAIL:demo@ilgo.app}
    password: ${APP_DEMO_PASSWORD:ilgo1234}
