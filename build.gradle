plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ilgo'
version = '0.0.1-SNAPSHOT'
description = 'Ilgo (읽고) backend API'

java {
    toolchain {
        // 스펙은 Java 17이나, 로컬/CI 환경이 JDK 21이라 21로 고정한다. (Spring Boot 3.5.x 호환)
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Spring Boot 3.5 호환을 위해 2.8.x 사용 (명세의 2.6.0 은 Boot 3.3 대응이라 /v3/api-docs 500 발생)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
    runtimeOnly    'org.postgresql:postgresql'

    // 로컬에서 DB 없이 bootRun(local 프로필)으로 Swagger 확인용. bootJar(배포본)에는 포함 안 됨.
    developmentOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'   // 매핑/레포지토리 슬라이스 테스트용 인메모리 DB
}

tasks.named('test') {
    useJUnitPlatform()
}